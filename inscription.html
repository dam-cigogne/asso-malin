<title>Inscription · Asso malin</title>
<style>

@keyframes fxFall{to{transform:translate3d(var(--dx,20px),110vh,0) rotate(360deg)}}

@keyframes fxPop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}@keyframes fxUp{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}

<body>
<div class="top"><small id="g">Inscription</small><h1 id="t">Inscription</h1><p id="w"></p><div id="ql"></div></div>
<div class="wrap"><div class="card" id="c">
<h2>Je m’inscris</h2>
<div class="row"><div><label for="nm">Nom</label><input id="nm" autocomplete="family-name" maxlength="40"></div><div><label for="pr">Prénom</label><input id="pr" autocomplete="given-name" maxlength="40"></div></div>
<label for="gr">Grade <small>(touche le tien · civil ou extérieur : « Civil » / « Extérieur »)</small></label><div id="gr"></div>
<div class="row"><div><label>Adultes</label><div class="num"><button type="button" data-n="na" data-d="-1">−</button><input id="na" inputmode="numeric" value="1"><button type="button" data-n="na" data-d="1">+</button></div></div>
<div><label>Enfants</label><div class="num"><button type="button" data-n="ne" data-d="-1">−</button><input id="ne" inputmode="numeric" value="0"><button type="button" data-n="ne" data-d="1">+</button></div></div></div>
<label for="tl">Téléphone</label><input id="tl" type="tel" autocomplete="tel" maxlength="20">
<label for="ml">Mail <small>(facultatif)</small></label><input id="ml" type="email" autocomplete="email" maxlength="80">
<label id="amq">Es-tu membre ?</label><div class="seg" id="am"><button type="button" data-v="o">Oui</button><button type="button" data-v="n">Non</button><button type="button" data-v="">Je ne sais pas</button></div>
<label for="rg">Régime ou allergies <small>(facultatif : végétarien, sans porc, allergie aux noix…)</small></label><input id="rg" maxlength="40">
<label for="mo">Un petit mot <small>(facultatif)</small></label><textarea id="mo" rows="2" maxlength="200"></textarea>
<label style="display:flex;gap:.6rem;align-items:flex-start;font-weight:400;margin-top:1rem"><input type="checkbox" id="okd" style="width:22px;height:22px;flex:none;margin:.1rem 0 0"><span>J’accepte que ces informations soient envoyées à l’amicale pour organiser cet événement (inscription, repas, paiement).<br><small style="color:var(--mut);display:block;margin-top:.3rem;line-height:1.4">🔒 Elles sont <b>chiffrées sur mon téléphone</b> avant l’envoi, puis gardées sur un serveur (Cloudflare) qui <b>ne peut pas les lire</b> : seuls les responsables de l’amicale ont la clé. Elles ne sont <b>ni vendues ni partagées</b>, et je peux demander au bureau de les corriger ou de les supprimer à tout moment. Aucun système n’étant infaillible à 100 %, je n’indique que ce qui est utile.</small></span></label>
<button class="go" id="go">✅ Envoyer mon inscription</button>
<p class="err" id="er" hidden></p>
<p class="mut" style="margin:.8rem 0 0">🔒 Tes informations sont chiffrées sur ton téléphone : seuls les organisateurs peuvent les lire. Elles servent uniquement à organiser cet événement.</p>
</div></div>
<script>
(function(){

var GR=['Soldat','1re classe','Caporal','Caporal-chef','Sergent','Sergent-chef','Adjudant','Adjudant-chef','Major','Aspirant','Sous-lieutenant','Lieutenant','Capitaine','Commandant','Lieutenant-colonel','Colonel','Général','Civil','Civil cat. B','Civil cat. C','Extérieur'];

$('gr').innerHTML=GG.map(function(g){return '<div class="gg">'+g[0]+'</div><div class="gb">'+g[1].map(function(x){return '<button type="button" data-g="'+x+'">'+x+'</button>'}).join('')+'</div>'}).join('');
var AM='';
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.g){GRV=b.dataset.g;[].forEach.call($('gr').querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});err('')}
 else if(b.dataset.n){var i=$(b.dataset.n),v=Math.max(0,Math.min(30,(parseInt(i.value,10)||0)+(+b.dataset.d)));i.value=v}
 else if(b.parentNode&&b.parentNode.id==='am'){AM=b.dataset.v;[].forEach.call($('am').children,function(x){x.classList.toggle('on',x===b)})}});
function err(t){var e=$('er');e.textContent=t;e.hidden=!t}
$('go').addEventListener('click',function(){
 if(!$('okd').checked){err('Coche la case d’accord (en bas) pour envoyer.');try{$('okd').scrollIntoView({block:'center'})}catch(e){}return}
 var nm=$('nm').value.trim(),pr=$('pr').value.trim(),na=Math.max(0,Math.min(30,parseInt($('na').value,10)||0)),ne=Math.max(0,Math.min(30,parseInt($('ne').value,10)||0)),tl=$('tl').value.trim();
 if(!nm||!pr){err('Merci d’écrire ton nom et ton prénom.');return}
 if(!GRV){err('Choisis ton grade (ou « Civil », « Extérieur »).');return}
 if(na+ne<1){err('Indique au moins une personne.');return}
 if(!tl&&!$('ml').value.trim()){err('Laisse un téléphone ou un mail pour qu’on puisse te joindre.');return}
 if(tl&&!/^\s*(\+|00)/.test(tl)&&!/^0[1-9]\d{8}$/.test(tl.replace(/[\s.\-()]/g,''))){err('Vérifie ton numéro : 10 chiffres en commençant par 0 (exemple : 06 12 34 56 78). Si tu as oublié le 0 du début, ajoute-le.');return}

 err('');var bt=$('go');bt.disabled=true;bt.textContent='Envoi…';
 var data={nm:nm,pr:pr,na:na,ne:ne,tl:tl,ml:$('ml').value.trim(),gr:GRV,am:AM,rg:$('rg').value.trim(),mo:$('mo').value.trim(),v:1};
 var S=crypto.subtle,kp,ej;

});
})();

 var TH={noel:'noel',noelf:'noel',galette:'galette',loto:'loto',lotof:'loto',repas:'repas',bbq:'bbq',hallo:'hallo',disco:'disco',nuit:'disco',sport:'sport',enfants:'enfant',ete:'ete'};
