<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="robots" content="noindex">
<title>Choisis ton menu · Asso malin</title>
<style>
:root{--ac:#7c3aed;--ac2:#db2777;--bg:#f6f3fb;--card:#fff;--tx:#1f1633;--mut:#6b6280;--line:#e4dcf2}
@media (prefers-color-scheme:dark){:root{--bg:#120d1f;--card:#1d1630;--tx:#f3eefc;--mut:#b3a8c9;--line:#342a4f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.top{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:28px 18px 70px;text-align:center}
.top small{display:block;opacity:.9;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
.top h1{margin:.3rem 0 .2rem;font:italic 700 1.9rem/1.15 Georgia,"Times New Roman",serif}
.top p{margin:.2rem 0 0;font-weight:600}
.ql{display:inline-block;margin:.7rem 0 0;padding:.45rem .9rem;border-radius:999px;background:#fff;color:#b91c1c;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.2);animation:qlp 1.8s ease-in-out infinite}@keyframes qlp{0%,100%{transform:scale(1);box-shadow:0 3px 10px rgba(0,0,0,.2),0 0 0 0 rgba(253,224,71,0)}50%{transform:scale(1.05);box-shadow:0 3px 10px rgba(0,0,0,.2),0 0 0 10px rgba(253,224,71,.55)}}.ql.bl{background:#dc2626;color:#fff;animation:qlb 1.1s ease-in-out infinite}.ql.cl{background:#fef3c7;color:#92400e}@keyframes qlb{50%{transform:scale(1.06);filter:brightness(1.25)}}@media (prefers-reduced-motion:reduce){.ql.bl{animation:none}}
.wrap{max-width:560px;margin:-50px auto 30px;padding:0 14px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(60,20,120,.15)}
h2{margin:0 0 .6rem;font-size:1.2rem}
label{display:block;margin:.65rem 0 .2rem;font-weight:700;font-size:.92rem}
label small{font-weight:400;color:var(--mut)}
input,textarea{width:100%;font:inherit;font-size:16px;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--tx)}
input:focus,textarea:focus{outline:none;border-color:var(--ac)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.num{display:flex;align-items:center;gap:8px}.num button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--tx);font-size:1.4rem;cursor:pointer}.num input{text-align:center;font-weight:800;font-size:1.15rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1;min-width:6rem;padding:.65rem;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.go{display:block;width:100%;margin-top:1.1rem;padding:.95rem;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:800;font-size:1.08rem;cursor:pointer}
.go[disabled]{opacity:.6}
.mut{color:var(--mut);font-size:.85rem}
.err{color:#c0392b;font-weight:700;margin-top:.6rem}
.ok{text-align:center;padding:10px 4px}.ok b{font-size:3rem;display:block}

/* animations (2.82.25) */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx i{position:absolute;top:-40px;font-style:normal;opacity:.85;animation:fxFall linear infinite;text-shadow:0 0 6px rgba(255,255,255,.8)}
@keyframes fxFall{to{transform:translate3d(var(--dx,20px),110vh,0) rotate(360deg)}}
#fx b{position:absolute;top:8%;left:-30%;width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,#fde68a);box-shadow:0 0 10px #fde68a;transform:rotate(18deg);animation:fxStar 7s ease-in 1.5s infinite}
@keyframes fxStar{0%{left:-30%;top:4%;opacity:0}8%{opacity:1}22%{left:120%;top:26%;opacity:0}100%{left:120%;top:26%;opacity:0}}
.top{background-size:220% 220%!important;animation:fxPan 9s ease-in-out infinite}
@keyframes fxPan{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.top h1{animation:fxPop .9s cubic-bezier(.2,1.6,.4,1) both}.top p,.top small,.top .ev,.top .meta,.top .g{animation:fxUp .8s .25s ease both}
@keyframes fxPop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}@keyframes fxUp{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.go{animation:fxGlow 2.4s ease-in-out infinite}@keyframes fxGlow{0%,100%{box-shadow:0 6px 18px rgba(124,58,237,.25)}50%{box-shadow:0 8px 28px rgba(219,39,119,.55)}}
.ok b{display:inline-block;animation:fxBounce 1s cubic-bezier(.2,1.8,.4,1) both}@keyframes fxBounce{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;border-radius:2px;animation:fxCf 2.6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fxCf{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){#fx,.cf{display:none}.top,.top h1,.top *,.go,.ok b{animation:none!important}}

.sl{margin:.9rem 0 0;padding:.8rem;border:1.5px solid var(--line);border-radius:14px}
.sl h3{margin:0 0 .3rem;font-size:1rem}
.cs{margin:.6rem 0 .1rem;font-weight:800;font-size:.92rem}
.op{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;margin:.3rem 0 0;padding:.65rem .8rem;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--tx);font:inherit;cursor:pointer}
.bx{flex:none;width:1.5rem;height:1.5rem;border:2px solid var(--mut);border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;line-height:1;color:transparent}.op.on{border-color:var(--ac);background:rgba(124,58,237,.12);font-weight:700}.op.on .bx{background:var(--ac);border-color:var(--ac);color:#fff}
.op.no{color:var(--mut);font-size:.9rem}.op.no.on{color:var(--tx)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;border-radius:2px;animation:fxCf 2.6s cubic-bezier(.3,.6,.5,1) forwards}@keyframes fxCf{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}
</style>
</head>
<body>
<div class="top"><small id="g">Menu</small><h1 id="t">Choisis ton menu</h1><p id="w"></p></div>
<div class="wrap"><div class="card" id="c"><div id="f"></div>
<label style="display:flex;gap:.6rem;align-items:flex-start;font-weight:400;margin-top:1rem"><input type="checkbox" id="okd" style="width:22px;height:22px;flex:none;margin:.1rem 0 0"><span>J’accepte que ces informations soient envoyées au groupe pour organiser le repas (mes choix de menu).<br><small style="color:var(--mut);display:block;margin-top:.3rem;line-height:1.4">🔒 Elles sont <b>chiffrées sur mon téléphone</b> avant l’envoi, puis gardées sur un serveur (Cloudflare) qui <b>ne peut pas les lire</b> : seuls les responsables du groupe ont la clé. Elles ne sont <b>ni vendues ni partagées</b>, et je peux demander au bureau de les corriger ou de les supprimer à tout moment. Aucun système n’étant infaillible à 100 %, je n’indique que ce qui est utile.</small></span></label>
<button class="go" id="go">✅ Envoyer mon choix</button>
<p class="err" id="er" hidden></p>
<p class="mut" style="margin:.8rem 0 0">🔒 Ton choix est chiffré sur ton téléphone : seuls les organisateurs peuvent le lire. Tu peux rouvrir ce lien pour le modifier tant que les organisateurs n’ont pas transmis les totaux au traiteur.</p>
</div></div>
<script>
(function(){
var API=(function(d){try{var m=/[?&]s=([^&#]+)/.exec(location.search);if(m){var u=decodeURIComponent(m[1]);if(/^https:\/\/[a-z0-9.-]+(\/[^\s?#]*)?$/i.test(u))return u.replace(/\/+$/,'')}}catch(e){}return d})('');
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function b64u(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function ub64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
var h=(location.hash||'').slice(1).split('.'),ID=h[0]||'',X=h[1]||'',Y=h[2]||'',info={};
try{info=JSON.parse(new TextDecoder().decode(ub64u(h[3]||'')))}catch(e){}
var TP=Array.isArray(info.tp)?info.tp:[];
if(!/^[0-9a-f]{32}$/.test(ID)||X.length<40||Y.length<40||!TP.length||!(info.i||info.gen)){$('c').innerHTML='<h2>Lien incomplet</h2><p>Ce lien n’est pas complet. Demande-le à nouveau à l’organisateur.</p>';return}
if(info.g)$('g').textContent=info.g;
if(info.t){$('t').textContent=info.t;document.title='Choisis ton menu · '+info.t}
var dd='';try{if(info.d){var D=new Date(info.d+'T12:00:00');dd=D.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});dd=dd.charAt(0).toUpperCase()+dd.slice(1)}}catch(e){}
$('w').textContent=[dd?'📅 '+dd:'',info.p?'📍 '+info.p:''].filter(Boolean).join('  ·  ');
var na=Math.max(0,Math.min(12,+info.a||0)),ne=Math.max(0,Math.min(12,+info.e||0));if(na+ne<1)na=1;if(na+ne>12)ne=Math.max(0,12-na);
var GEN=!!info.gen,GN='',SK='agd-mn-'+(GEN?'g'+ID:info.i),SV={};try{SV=JSON.parse(localStorage.getItem(SK)||'{}')||{}}catch(e){}
var S0,CH,NM;
function init(){S0=[];for(var i=0;i<na;i++)S0.push({k:'a',n:i===0?String(GEN?GN:info.n||''):''});for(var j=0;j<ne;j++)S0.push({k:'e',n:''});
CH=S0.map(function(_,i){var r=(SV.c||[])[i];return TP.map(function(_,c){return r&&typeof r[c]==='number'?r[c]:null})});
NM=S0.map(function(s,i){return (i===0&&GEN)?GN:((SV.n&&SV.n[i]!=null)?SV.n[i]:s.n)})}
if(GEN){na=1;ne=0;try{GN=SV.gn||'';if(SV.na)na=+SV.na;if(SV.ne)ne=+SV.ne}catch(e){}}
init();
var GN0='';
function draw(){if(GEN&&!GN){drawId();return}var o=(GEN?'<p class="mut" style="margin:0 0 .6rem"><b>'+esc(GN)+'</b> · <button type="button" id="chg" style="border:0;background:none;color:var(--ac);font:inherit;font-weight:700;text-decoration:underline;padding:0;cursor:pointer">Ce n’est pas moi / changer le nombre de personnes</button></p>':'')+'<p style="margin:0 0 .2rem">Bonjour'+((info.n||GN)?' <b>'+esc(String(info.n||GN).split(' ').slice(-1)[0])+'</b>':'')+' ! Choisis un plat pour chaque personne'+(na+ne>1?' ('+na+' adulte'+(na>1?'s':'')+(ne?' + '+ne+' enfant'+(ne>1?'s':''):'')+')':'')+'.</p>';
 S0.forEach(function(s,i){o+='<div class="sl"><h3>'+(i===0&&s.k==='a'?'👤 '+esc(NM[i]||'Toi'):(s.k==='a'?'👤 Adulte '+(i+1):'🧒 Enfant '+(i-na+1)))+'</h3>'+(i===0&&s.k==='a'?'':'<input data-nm="'+i+'" maxlength="30" placeholder="Prénom (facultatif)" value="'+esc(NM[i])+'">');
  TP.forEach(function(t,c){o+='<div class="cs">'+esc(t.l)+'</div>';(t.o||[]).forEach(function(x,k){o+='<button type="button" class="op'+(CH[i][c]===k?' on':'')+'" data-i="'+i+'" data-c="'+c+'" data-k="'+k+'"><span class="bx">✓</span><span>'+esc(x)+'</span></button>'});o+='<button type="button" class="op no'+(CH[i][c]===-1?' on':'')+'" data-i="'+i+'" data-c="'+c+'" data-k="-1"><span class="bx">✓</span><span>Je n’en prends pas</span></button>'});o+='</div>'});
 $('f').innerHTML=o}
function drawId(){$('go').style.display='none';$('f').innerHTML='<p style="margin:0 0 .4rem"><b>Qui es-tu ?</b> Écris ton nom comme à l’inscription, pour que ton choix soit rangé au bon endroit.</p><label>Nom et prénom</label><input id="gn" maxlength="40" placeholder="DUPONT Jean" autocomplete="name" value="'+esc(GN0)+'"><div class="row"><div><label>Adultes <small>(toi compris)</small></label><div class="num"><button type="button" data-st="a-">−</button><input id="gna" value="'+na+'" readonly><button type="button" data-st="a+">+</button></div></div><div><label>Enfants</label><div class="num"><button type="button" data-st="e-">−</button><input id="gne" value="'+ne+'" readonly><button type="button" data-st="e+">+</button></div></div></div><button type="button" class="go" id="gnx" style="display:block">Continuer</button>'}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-st]');if(b){var k=b.dataset.st;if(k==='a-')na=Math.max(1,na-1);if(k==='a+')na=Math.min(12-ne,na+1);if(k==='e-')ne=Math.max(0,ne-1);if(k==='e+')ne=Math.min(12-na,ne+1);$('gna').value=na;$('gne').value=ne;return}
 if(e.target.id==='chg'){GN0=GN;GN='';$('go').style.display='none';draw();return}
 if(e.target.id==='gnx'){var v=($('gn').value||'').trim();if(v.length<3){err('Écris ton nom et ton prénom.');return}err('');GN=v;try{localStorage.setItem(SK,JSON.stringify({gn:GN,na:na,ne:ne,c:SV.c,n:SV.n}))}catch(x){}init();$('go').style.display='';draw()}});
draw();
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.nm!=null)NM[+t.dataset.nm]=t.value});
document.addEventListener('click',function(e){var b=e.target.closest('.op');if(!b)return;CH[+b.dataset.i][+b.dataset.c]=+b.dataset.k;var y=window.scrollY;draw();window.scrollTo(0,y)});
function err(t){var e=$('er');e.textContent=t;e.hidden=!t}
$('go').addEventListener('click',function(){
 if(!$('okd').checked){err('Coche la case d’accord (en bas) pour envoyer.');try{$('okd').scrollIntoView({block:'center'})}catch(e){}return}
 for(var i=0;i<CH.length;i++)for(var c=0;c<TP.length;c++)if(CH[i][c]===null){err('Il manque un choix : '+(i===0&&S0[0].k==='a'?'toi':(NM[i]||(S0[i].k==='a'?'adulte '+(i+1):'enfant')))+' · '+TP[c].l+'.');return}
 err('');var bt=$('go');bt.disabled=true;bt.textContent='Envoi…';
 var data={k:'mn',pid:GEN?'':info.i,gn:GEN?GN:undefined,na:na,ne:ne,s:info.s||'',L:S0.map(function(s,i){return {n:String(i===0&&s.k==='a'?'':NM[i]||'').trim().slice(0,30),c:CH[i]}}),v:1};
 var S=crypto.subtle,kp,ej;
 S.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']).then(function(k){kp=k;return S.exportKey('jwk',k.publicKey)}).then(function(j){ej=j;
  return S.importKey('jwk',{kty:'EC',crv:'P-256',x:X,y:Y,ext:true},{name:'ECDH',namedCurve:'P-256'},false,[])}).then(function(pub){
  return S.deriveBits({name:'ECDH',public:pub},kp.privateKey,256)}).then(function(bits){
  var salt=new TextEncoder().encode('agd-qr:'+ID),b=new Uint8Array(bits),all=new Uint8Array(b.length+salt.length);all.set(b);all.set(salt,b.length);
  return S.digest('SHA-256',all)}).then(function(hk){return S.importKey('raw',hk,'AES-GCM',false,['encrypt'])}).then(function(key){
  var iv=crypto.getRandomValues(new Uint8Array(12));return S.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(data))).then(function(c){return {e:{x:ej.x,y:ej.y},iv:b64u(iv),c:b64u(c)}})}).then(function(body){
  return fetch(API+'/in/'+ID,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}).then(function(r){
  if(!r.ok)return r.json().then(function(j){throw new Error(j&&j.error||('erreur '+r.status))},function(){throw new Error('erreur '+r.status)});
  try{localStorage.setItem(SK,JSON.stringify({c:CH,n:NM,gn:GN,na:na,ne:ne}))}catch(e){}
  var rec=S0.map(function(s,i){return '<li><b>'+esc((i===0&&s.k==='a')?(NM[i]||'Toi'):(NM[i]||(s.k==='a'?'Adulte '+(i+1):'Enfant')))+'</b> : '+TP.map(function(t,c){return CH[i][c]===-1?'—':esc((t.o||[])[CH[i][c]]||'')}).join(' · ')+'</li>'}).join('');
  $('c').innerHTML='<div class="ok"><b>🎉</b><h2>C’est envoyé !</h2><p>Merci, ton choix est bien arrivé chez les organisateurs.</p></div><ul style="padding-left:1.1rem">'+rec+'</ul><p class="mut">Une erreur ? Rouvre simplement ton lien et renvoie : le dernier choix remplace le précédent.</p>';
  try{fxBoom()}catch(e){}
 }).catch(function(e){bt.disabled=false;bt.textContent='✅ Envoyer mon choix';err('Envoi impossible : '+(e&&e.message||'vérifie ta connexion')+'. Réessaie dans un instant.')});
});
function fxBoom(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;var C=['#7c3aed','#db2777','#f59e0b','#10b981','#3b82f6','#ef4444'];for(var k=0;k<60;k++){var d=document.createElement('i');d.className='cf';d.style.left=(Math.random()*100)+'vw';d.style.background=C[k%6];d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.setProperty('--r',(Math.random()*720)+'deg');d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);(function(x){setTimeout(function(){x.remove()},3500)})(d)}}catch(e){}}
})();
</script>
<script>
/* 2.82.168 : page ouverte DANS l’appli installée (iPhone) : pas de bouton retour → on en ajoute un */
(function(){try{var st=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);if(!st)return;
var b=document.createElement('a');b.href='./';b.id='agd-back';b.textContent='← Retour à l’appli';
b.setAttribute('style','position:fixed;left:12px;top:12px;top:calc(env(safe-area-inset-top, 0px) + 8px);z-index:99999;background:#ffffff;color:#4c1d95;border:2px solid #7c3aed;border-radius:999px;padding:9px 16px;font:700 16px -apple-system,system-ui,sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.25);text-decoration:none');
document.body.appendChild(b)}catch(e){}})();
</script>
</body>
</html>
