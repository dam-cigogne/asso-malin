<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="robots" content="noindex">
<title>Sondage</title>
<style>
:root{--ac:#7c3aed;--ac2:#db2777;--bg:#f6f3fb;--card:#fff;--tx:#1f1633;--mut:#6b6280;--line:#e4dcf2}
@media (prefers-color-scheme:dark){:root{--bg:#120d1f;--card:#1d1630;--tx:#f3eefc;--mut:#b3a8c9;--line:#342a4f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
.top{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:28px 18px 70px;text-align:center}
.top small{display:block;opacity:.9;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
.top h1{margin:.3rem 0 .2rem;font:italic 700 1.9rem/1.15 Georgia,"Times New Roman",serif}
.top p{margin:.2rem 0 0;font-weight:600}
.wrap{max-width:560px;margin:-50px auto 30px;padding:0 14px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(60,20,120,.15)}
h2{margin:0 0 .6rem;font-size:1.2rem}
label{display:block;margin:.65rem 0 .2rem;font-weight:700;font-size:.92rem}
label small{font-weight:400;color:var(--mut)}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--tx)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.num{display:flex;align-items:center;gap:8px}.num button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--tx);font-size:1.4rem;cursor:pointer}.num input{text-align:center;font-weight:800;font-size:1.15rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1 1 40%;min-width:6rem;padding:.65rem;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.go{display:block;width:100%;margin-top:1.1rem;padding:.95rem;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:800;font-size:1.08rem;cursor:pointer}
.go[disabled]{opacity:.6}
.mut{color:var(--mut);font-size:.85rem}
.err{color:#c0392b;font-weight:700;margin-top:.6rem}
.paper{background:#fff;color:#1a1a1a;border-radius:12px;padding:14px 14px 10px;border:1px solid var(--line);max-height:52vh;overflow:auto;font-size:.88rem;line-height:1.4;-webkit-overflow-scrolling:touch}
.paper .ti{font-weight:900;text-align:center;border:2px solid #1a1a1a;padding:8px;margin:0 0 10px;text-transform:uppercase}
.paper .ar{font-weight:800;text-decoration:underline;margin:.7rem 0 .2rem}.paper p{margin:.25rem 0}.paper ul{margin:.2rem 0 .2rem 1.1rem;padding:0}
.bu{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;border-top:1px solid #ddd;padding-top:10px}.bu div{flex:1 1 30%;min-width:90px;text-align:center;font-size:.8rem}.bu u{display:block}.bu img{max-width:100%;height:42px;object-fit:contain}
.me{border:1.5px solid #1a1a1a;border-radius:8px;padding:8px 10px;margin-top:12px;font-size:.85rem}.me b{font-weight:800}
.pay{margin:.9rem 0 .2rem;padding:.75rem .9rem;border-radius:14px;background:linear-gradient(135deg,rgba(124,58,237,.12),rgba(219,39,119,.12));font-weight:700}
.pay big{font-size:1.5rem;font-weight:900;color:var(--ac)}
#sgc{width:100%;height:auto;aspect-ratio:760/260;background:#fff;border:2px dashed #c4b5fd;border-radius:14px;touch-action:none;display:block;margin-top:.3rem}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;padding:.4rem 0;cursor:pointer}
.phs{display:flex;gap:10px;flex-wrap:wrap}.phs div{position:relative}.phs img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1.5px solid var(--line);display:block}.phs button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:#c0392b;color:#fff;font-weight:800;cursor:pointer}
.ok{text-align:center;padding:10px 4px}.ok b{font-size:3rem;display:block}

/* animations (2.82.25) */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx i{position:absolute;top:-40px;font-style:normal;opacity:.85;animation:fxFall linear infinite;text-shadow:0 0 6px rgba(255,255,255,.8)}
@keyframes fxFall{to{transform:translate3d(var(--dx,20px),110vh,0) rotate(360deg)}}
#fx b{position:absolute;top:8%;left:-30%;width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,#fde68a);box-shadow:0 0 10px #fde68a;transform:rotate(18deg);animation:fxStar 7s ease-in 1.5s infinite}
@keyframes fxStar{0%{left:-30%;top:4%;opacity:0}8%{opacity:1}22%{left:120%;top:26%;opacity:0}100%{left:120%;top:26%;opacity:0}}
.top{background-size:220% 220%!important;animation:fxPan 9s ease-in-out infinite}
@keyframes fxPan{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.top h1{animation:fxPop .9s cubic-bezier(.2,1.6,.4,1) both}.top p,.top small,.top .ev,.top .meta,.top .g{animation:fxUp .8s .25s ease both}
@keyframes fxPop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}@keyframes fxUp{0%{transform:translateY(12px);opacity:0}100%{transform:none;opacity:1}}
.go{animation:fxGlow 2.4s ease-in-out infinite}@keyframes fxGlow{0%,100%{box-shadow:0 6px 18px rgba(124,58,237,.25)}50%{box-shadow:0 8px 28px rgba(219,39,119,.55)}}
.ok b{display:inline-block;animation:fxBounce 1s cubic-bezier(.2,1.8,.4,1) both}@keyframes fxBounce{0%{transform:scale(0) rotate(-30deg)}100%{transform:none}}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:60;pointer-events:none;border-radius:2px;animation:fxCf 2.6s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fxCf{to{transform:translate3d(var(--dx),105vh,0) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){#fx,.cf{display:none}.top,.top h1,.top *,.go,.ok b{animation:none!important}}

.q{margin:1rem 0 0;padding:.85rem .9rem;border:1.5px solid var(--line);border-radius:16px}
.q h3{margin:0 0 .5rem;font-size:1rem}
.q .seg button{flex:1 1 auto}
.stars{display:flex;gap:6px}.stars button{flex:1;padding:.55rem 0;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-size:1.5rem;color:#d6cde6;cursor:pointer}.stars button.on{color:#f59e0b;border-color:#f59e0b}
.pv{background:#fef3c7;color:#92400e;border-radius:12px;padding:.6rem .8rem;font-weight:700;margin:0 0 .6rem}
.end{display:inline-block;margin-top:.5rem;background:rgba(255,255,255,.2);border-radius:999px;padding:.25rem .8rem;font-weight:700;font-size:.9rem}
</style>
</head>
<body>
<div class="top"><small id="g"></small><h1 id="ti">📊 Sondage</h1><p id="in"></p><span class="end" id="en" hidden></span></div>
<div class="wrap"><div class="card" id="c"><p class="mut">Chargement du sondage…</p></div></div>
<script>
(function(){
var API=(function(d){try{var m=/[?&]s=([^&#]+)/.exec(location.search);if(m){var u=decodeURIComponent(m[1]);if(/^https:\/\/[a-z0-9.-]+(\/[^\s?#]*)?$/i.test(u))return u.replace(/\/+$/,'')}}catch(e){}return d})('');
var $=function(i){return document.getElementById(i)};
function b64u(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function ub64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
var E=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var h=(location.hash||'').slice(1).split('.'),ID=h[0]||'',X=h[1]||'',Y=h[2]||'',info={},PV=h[4]==='pv',TOK=String(h[5]||'').replace(/[^A-Za-z0-9]/g,'').slice(0,16);
try{info=JSON.parse(new TextDecoder().decode(ub64u(h[3]||'')))}catch(e){}
if(info.g)$('g').textContent=info.g;
function fin(t){$('c').innerHTML=t}
if(!/^[0-9a-f]{32}$/.test(ID)||X.length<40||Y.length<40){fin('<h2>Lien incomplet</h2><p>Ce QR code ou ce lien n’est pas complet. Scanne-le à nouveau ou demande le lien au bureau.</p>');return}
var KEY='agd-sd-'+ID+(TOK?'-'+TOK:''),D=null,A=[],VT=false;
function done(){try{return localStorage.getItem(KEY)}catch(e){return null}}
crypto.subtle.digest('SHA-256',new TextEncoder().encode('agd-sdpub:'+ID)).then(function(hb){var pid=Array.prototype.map.call(new Uint8Array(hb).slice(0,16),function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
 return fetch(API+'/pub/'+pid+'?t='+Date.now())}).then(function(r){return r.ok?r.json():null}).then(function(j){
 if(!j||!j.d||j.d.t!=='sd'){fin('<h2>Sondage introuvable</h2><p>Ce sondage n’existe plus ou n’est pas encore en ligne. Réessaie dans un moment.</p>');return}
 D=j.d;if(D.g)$('g').textContent=D.g;$('ti').textContent=(D.ty==='v'?'🗳 ':'📊 ')+(D.ti||'Sondage');document.title=(D.ti||'Sondage')+(D.g?' · '+D.g:'');$('in').textContent=D.in||'';
 var end=D.end?Date.parse(D.end):0,stop=Math.min(end||Infinity,D.cl||Infinity);
 if(isFinite(stop)){$('en').hidden=false;$('en').textContent=(Date.now()<stop?'⏰ Ouvert jusqu’au ':'🔒 Terminé le ')+new Date(stop).toLocaleString('fr-FR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}
 try{fxStart(D.ti||'sondage')}catch(e){}
 if(D.gone||Date.now()>=stop){fin('<div class="ok"><b>🔒</b><h2>Ce sondage est terminé</h2><p>Merci de ton intérêt ! Les réponses ne sont plus acceptées.</p></div>');return}
 VT=D.ty==='v';if(VT){D.mode='a';(D.Q||[]).forEach(function(q){q.k='u';q.o=(q.o||[]).concat(['Vote blanc'])})}
 if(VT&&(D.el==='cot'||D.el==='all')&&!TOK&&!PV){fin('<h2>🗳 Lien personnel nécessaire</h2><p>Pour ce vote, chaque électeur a <b>son propre lien</b>, envoyé par le bureau (SMS ou WhatsApp). Ouvre le lien que tu as reçu.</p>');return}
 if(done()&&!PV){fin(VT?'<div class="ok"><b>🗳</b><h2>Tu as déjà voté</h2><p>Merci ! On ne vote qu’une fois.</p></div>':'<div class="ok"><b>✅</b><h2>Tu as déjà répondu</h2><p>Merci ! Une seule réponse par téléphone.</p></div>');return}
 draw()}).catch(function(){fin('<h2>Pas de connexion</h2><p>Vérifie ta connexion internet, puis recharge la page.</p>')});
function draw(){var Q=D.Q||[],m=D.mode||'c',o='';
 if(PV)o+='<p class="pv">👁 Aperçu : c’est ce que voit la personne. Les réponses ne sont pas envoyées.</p>';
 if(VT)o+='<p class="pv" style="background:#ede9fe;color:#4c1d95">🔒 Vote à bulletin secret : le bureau sait que tu as voté, jamais pour qui. Choisis une réponse par poste (ou vote blanc).</p>'+(D.el==='ag'&&!TOK?'<label for="cd">Ton code de vote <small>(sur ton papier)</small></label><input id="cd" maxlength="8" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em;font-weight:800">':'');
 else if(m!=='a')o+='<label for="nm">Ton nom'+(m==='c'?' <small>(facultatif : tu peux rester anonyme)</small>':' <small>(obligatoire)</small>')+'</label><input id="nm" maxlength="60" autocomplete="name">';
 else o+='<p class="mut">🕶️ Sondage anonyme : ton nom n’est pas demandé.</p>';
 Q.forEach(function(q,i){o+='<div class="q"><h3>'+(i+1)+'. '+E(q.t)+'</h3>';
  if(q.k==='u'||q.k==='yn'||q.k==='m'){var O=q.k==='yn'?['Oui','Non']:(q.o||[]);o+='<div class="seg" data-q="'+i+'" data-k="'+q.k+'">'+O.map(function(x){return '<button type="button" data-v="'+E(x)+'">'+E(x)+'</button>'}).join('')+'</div>'+(q.k==='m'?'<p class="mut" style="margin:.3rem 0 0">Plusieurs choix possibles.</p>':'')}
  else if(q.k==='st')o+='<div class="stars" data-q="'+i+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-v="'+n+'" aria-label="'+n+' étoile'+(n>1?'s':'')+'">★</button>'}).join('')+'</div>';
  else if(q.k==='nb')o+='<input type="number" inputmode="decimal" data-q="'+i+'" class="fi">';
  else if(q.k==='dt')o+='<input type="date" data-q="'+i+'" class="fi">';
  else o+='<textarea rows="3" maxlength="300" data-q="'+i+'" class="fi" placeholder="Ta réponse…"></textarea>';
  o+='</div>'});
 o+='<button class="go" id="go" type="button">📨 Envoyer mes réponses</button><p class="err" id="er" hidden></p><p class="mut" style="margin:.8rem 0 0">🔒 Tes réponses sont chiffrées sur ton téléphone : seul le bureau peut les lire. Une seule réponse par téléphone.</p>';
 if(VT)o=o.replace('📨 Envoyer mes réponses','🗳 Voter');
 fin(o);A=Q.map(function(q){return q.k==='m'?[]:''});
 $('c').addEventListener('click',function(e){var b=e.target.closest('button[data-v]');if(!b)return;var g=b.parentNode,i=+g.dataset.q,q=D.Q[i];
  if(g.classList.contains('stars')){A[i]=+b.dataset.v;[].forEach.call(g.children,function(x){x.classList.toggle('on',+x.dataset.v<=A[i])});return}
  var v=b.dataset.v;if(q.k==='m'){var L=A[i],k=L.indexOf(v);if(k>=0)L.splice(k,1);else L.push(v);b.classList.toggle('on',k<0)}else{A[i]=A[i]===v?'':v;[].forEach.call(g.children,function(x){x.classList.toggle('on',x.dataset.v===A[i])})}});
 $('go').onclick=go}
function err(t){var e=$('er');e.textContent=t;e.hidden=!t}
function go(){[].forEach.call(document.querySelectorAll('.fi'),function(f){var i=+f.dataset.q;A[i]=String(f.value||'').trim().slice(0,300)});
 var nm=$('nm')?$('nm').value.trim().slice(0,60):'';if(D.mode==='n'&&!nm){err('Écris ton nom (en haut) pour envoyer.');try{$('nm').focus()}catch(e){}return}
 var tok=TOK;if(VT&&D.el==='ag'&&!tok){tok=($('cd')?$('cd').value:'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();if(tok.length<4){err('Tape ton code de vote (sur ton papier).');try{$('cd').focus()}catch(e){}return}try{if(localStorage.getItem('agd-sd-'+ID+'-'+tok)&&!PV){err('Ce code a déjà servi sur ce téléphone.');return}}catch(e){}KEY='agd-sd-'+ID+'-'+tok}
 if(VT&&A.some(function(v){return v===''||v==null})){err('Choisis une réponse pour chaque poste (ou « Vote blanc »).');return}
 if(!A.some(function(v){return Array.isArray(v)?v.length:v!==''&&v!=null})){err('Réponds au moins à une question.');return}
 if(PV){err('');fin('<div class="ok"><b>👁</b><h2>Aperçu terminé</h2><p>En vrai, la personne verrait ici « Merci, tes réponses sont bien arrivées ». Rien n’a été envoyé.</p></div>');return}
 err('');var bt=$('go');bt.disabled=true;bt.textContent='Envoi…';var S=crypto.subtle,kp,ej,data=JSON.stringify({t:'sd',v:1,nm:D.mode==='a'?'':nm,a:A,tok:tok||''});
 S.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']).then(function(k){kp=k;return S.exportKey('jwk',k.publicKey)}).then(function(j){ej=j;
  return S.importKey('jwk',{kty:'EC',crv:'P-256',x:X,y:Y,ext:true},{name:'ECDH',namedCurve:'P-256'},false,[])}).then(function(pub){
  return S.deriveBits({name:'ECDH',public:pub},kp.privateKey,256)}).then(function(bits){
  var salt=new TextEncoder().encode('agd-qr:'+ID),b=new Uint8Array(bits),all=new Uint8Array(b.length+salt.length);all.set(b);all.set(salt,b.length);
  return S.digest('SHA-256',all)}).then(function(hk){return S.importKey('raw',hk,'AES-GCM',false,['encrypt'])}).then(function(key){
  var iv=crypto.getRandomValues(new Uint8Array(12));return S.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(data)).then(function(c){var o={e:{x:ej.x,y:ej.y},iv:b64u(iv),c:b64u(c)};if(o.c.length>3800)throw new Error('réponses trop longues : raccourcis un peu tes textes');return o})}).then(function(body){
  return fetch(API+'/in/'+ID,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}).then(function(r){
  if(!r.ok)return r.json().then(function(j){throw new Error(j&&j.error||('erreur '+r.status))},function(){throw new Error('erreur '+r.status)});

 }).catch(function(e){bt.disabled=false;bt.textContent=VT?'🗳 Voter':'📨 Envoyer mes réponses';err('Envoi impossible : '+(e&&e.message||'vérifie ta connexion')+'. Réessaie dans un instant.')})}
})();
</script>
<script>
/* animations (2.82.25) : décor selon l'événement (neige à Noël, raisins au Beaujolais, médailles à la Saint-Éloi…), étoile filante, confettis */
function fxTheme(t,th){t=String(t||'').toLowerCase();th=String(th||'');var R=[
 ['eloi',/[ée]loi|militaire|c[ée]r[ée]monie|14 juillet|armistice|11 novembre|8 mai|r[ée]giment|prise d.armes|d[ée]fil[ée]/,['🎖️','⭐','✦','🎖️','✦'],['#1d4ed8','#ffffff','#dc2626']],
 ['vin',/beaujolais|vin\b|vins|vendange|[œo]e?nolog|d[ée]gustation|\bcave\b|ap[ée]ro|ap[ée]ritif/,['🍇','🍷','🥂','🍇','🧀'],0],

 ['bbq',/barbecue|bbq|grillade|m[ée]choui|plancha|paella/,['🔥','🍖','🌭','🍉','🍔'],0],

 ['repas',/casse[- ]?cro[uû]te|midi|d[ée]jeuner|repas|buffet|d[îi]ner|banquet|pique[- ]nique|\bpot\b/,['🥖','🧀','🥪','🍷','☕'],0],
 ['loto',/loto|tombola|bingo|quine/,['🎱','🍀','🎁','⭐'],0],
 ['sport',/foot|match|tournoi|sport|course|rando|p[ée]tanque|cross|v[ée]lo|marche/,['🏆','⚽','🥇','🏅'],0],
 ['disco',/dansante|disco|\bbal\b|\bdj\b|karaok|soir[ée]e/,['🎵','🪩','💃','🕺','✨'],0],
 ['enfant',/enfant|kid|go[ûu]ter/,['🎈','🧸','🍭','🎨'],0],
 ['ete',/[ée]t[ée]\b|plage|piscine|juillet|ao[ûu]t|soleil/,['☀️','🌴','🍉','🍦'],0],
 ['adh',/adh[ée]sion|amicale/,['🎖️','✨','⭐','✨'],0]];
 var TH={noel:'noel',noelf:'noel',galette:'galette',loto:'loto',lotof:'loto',repas:'repas',bbq:'bbq',hallo:'hallo',disco:'disco',nuit:'disco',sport:'sport',enfants:'enfant',ete:'ete'};
 for(var k=0;k<R.length;k++)if(R[k][1].test(t))return {k:R[k][0],e:R[k][2],c:R[k][3]};
 if(TH[th])for(var j=0;j<R.length;j++)if(R[j][0]===TH[th])return {k:R[j][0],e:R[j][2],c:R[j][3]};
